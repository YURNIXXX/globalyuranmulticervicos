<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área do Profissional | Yuran Multicerviços</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/platform.css"></head><body class="platform-body">
<header class="platform-top"><a href="/" class="platform-brand">Yuran Multicerviços</a><a href="/profissionais">Ver profissionais</a></header>
<main class="auth-shell"><section class="auth-intro"><span class="eyebrow">ÁREA PROFISSIONAL</span><h1>Apresente o seu trabalho.</h1><p>Crie o seu perfil, publique serviços e projetos. Todo conteúdo passa por análise antes de ficar público.</p></section><section class="auth-card"><div class="auth-tabs"><button class="active" data-auth-tab="login">Entrar</button><button data-auth-tab="register">Criar conta</button></div><form id="loginForm" class="auth-form"><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha" required><button class="btn primary">Entrar</button><p class="form-message" id="loginMsg"></p></form><form id="registerForm" class="auth-form hidden"><input name="name" placeholder="Nome completo" required><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" minlength="8" placeholder="Senha (mín. 8 caracteres)" required><label class="check"><input type="checkbox" required> Confirmo que as informações e trabalhos enviados são verdadeiros e autorizados.</label><button class="btn primary">Criar conta</button><p class="form-message" id="registerMsg"></p></form></section></main>
<script src="/js/professional-auth.js"></script></body></html>
